[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spacewalker-linux"
dynamic = ["version"]
description = "Independent Linux spatial desktop and VR video viewer for VITURE glasses"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video :: Display",
]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "PyOpenGL>=3.1.9,<4", "numpy>=2,<3", "python-xlib>=0.33,<1", "mss>=10,<11"]

[project.optional-dependencies]
test = ["pytest>=8"]
release = ["build>=1.2", "twine>=6", "ruff>=0.11", "pip-audit>=2.9"]

[project.scripts]
spacewalker = "spacewalker.__main__:main"

[tool.setuptools.package-data]
spacewalker = ["shaders/*.glsl", "native/*.c", "native/protocols/*.xml", "web/*.html", "web/*.js", "web/*.css", "icons/*.svg"]

[tool.setuptools.dynamic]
version = {attr = "spacewalker.__version__"}

[tool.setuptools.packages.find]
include = ["spacewalker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Catch runtime mistakes without reformatting the existing compact codebase.
select = ["E9", "F63", "F7", "F82"]
